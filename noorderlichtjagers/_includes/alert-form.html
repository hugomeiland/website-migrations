{% if include.compact or include.stacked %}
<form class="alert-form{% if include.compact %} alert-form--compact{% endif %}{% if include.stacked %} alert-form--stacked{% endif %}" action="{{ site.alert.action }}" method="post" accept-charset="UTF-8">
{% else %}
<form class="alert-form" action="{{ site.alert.action }}" method="post" accept-charset="UTF-8">
{% endif %}
  <input type="hidden" name="admin_id" value="{{ site.alert.admin_id }}">
  <input type="hidden" name="trigger_code" value="{{ site.alert.trigger_code }}">
  <input type="hidden" name="confirm" value="false">
  {% assign suffix = '' %}
  {% if include.compact %}{% assign suffix = '_c' %}{% endif %}
  {% if include.stacked %}{% assign suffix = '_s' %}{% endif %}
  <div class="alert-form__field">
    <label class="sr-only" for="relation_firstName{{ suffix }}">Voornaam</label>
    <input type="text" id="relation_firstName{{ suffix }}" name="relation_firstName" placeholder="Voornaam ..." required>
  </div>
  <div class="alert-form__field">
    <label class="sr-only" for="relation_email{{ suffix }}">E-mailadres</label>
    <input type="email" id="relation_email{{ suffix }}" name="relation_email" placeholder="E-mailadres ..." required>
  </div>
  <button type="submit">Versturen</button>
</form>
