<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="Noorderlichtjagers" width="268" height="48">
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Hoofdmenu">
      <ul>
        {% assign current = page.url | remove: 'index.html' %}
        <li><a href="{{ '/' | relative_url }}"{% if current == '/' %} class="is-active"{% endif %}>Home</a></li>
        <li><a href="{{ '/monitor/' | relative_url }}"{% if current == '/monitor/' %} class="is-active"{% endif %}>Monitor</a></li>
        <li><a href="{{ '/noorderlicht/' | relative_url }}"{% if current == '/noorderlicht/' %} class="is-active"{% endif %}>Noorderlicht</a></li>
        <li><a href="{{ '/tips/' | relative_url }}"{% if current == '/tips/' %} class="is-active"{% endif %}>Tips</a></li>
        <li><a href="{{ '/fotos/' | relative_url }}"{% if current == '/fotos/' %} class="is-active"{% endif %}>Foto’s</a></li>
        <li><a href="{{ '/blog/' | relative_url }}"{% if current == '/blog/' or page.layout == 'post' %} class="is-active"{% endif %}>Blog</a></li>
        <li><a href="{{ '/veelgestelde-vragen/' | relative_url }}"{% if current == '/veelgestelde-vragen/' or current == '/faq/' %} class="is-active"{% endif %}>FAQ</a></li>
        <li><a href="{{ '/contact/' | relative_url }}"{% if current == '/contact/' %} class="is-active"{% endif %}>Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
