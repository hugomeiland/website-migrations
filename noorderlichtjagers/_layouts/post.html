---
layout: default
---
<article class="post-single">
  <div class="container">
    <header class="post-header">
      <h1>{{ page.title }}</h1>
      <p class="post-meta">
        {% if page.author %}door {{ page.author }} | {% endif %}
        <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%b %-d, %Y' }}</time>
        {% if page.categories %} | {{ page.categories | join: ', ' }}{% endif %}
      </p>
    </header>
    {% if page.image %}
    <figure class="post-hero">
      <img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}" loading="eager">
    </figure>
    {% endif %}
    <div class="prose post-body">
      {{ content }}
    </div>
    <p class="back-link"><a href="{{ '/blog/' | relative_url }}">← Terug naar blog</a></p>
  </div>
</article>
