---
layout: default
title: Foto’s
description: Selectie noorderlichtfoto’s van de noorderlichtjagers en inzenders.
permalink: /fotos/

<section class="page-content">
  <div class="container">
    <h1 class="page-content__title">Foto’s</h1>
    <p style="max-width:40rem;margin-bottom:1.5rem;color:#666">Een selectie noorderlichtfoto’s — van sterke stormen tot subtiele gloed boven de Nederlandse horizon.</p>
    <div class="photo-grid">
      {% for i in (1..12) %}
      <figure>
        <img src="{{ '/assets/img/gallery/g' | append: i | append: '.jpg' | relative_url }}" alt="Noorderlichtfoto {{ i }}" loading="lazy">
      </figure>
      {% endfor %}
    </div>
  </div>
</section>
