---
layout: default
title: Foto’s
description: Selectie noorderlichtfoto’s van de noorderlichtjagers en inzenders.
permalink: /fotos/
---

<section class="page-content">
  <div class="container">
    <h1 class="page-content__title page-content__title--center"><strong>Foto’s</strong></h1>
    <div class="photo-grid">
      {% for photo in site.data.fotos %}
      <figure>
        <a href="{{ photo.full | relative_url }}" title="{{ photo.caption | escape }}">
          <img src="{{ photo.thumb | relative_url }}" alt="{{ photo.caption | escape }}" width="400" height="284" loading="{% if forloop.index <= 6 %}eager{% else %}lazy{% endif %}">
        </a>
      </figure>
      {% endfor %}
    </div>
  </div>
</section>
